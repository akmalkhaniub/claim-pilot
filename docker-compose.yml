version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: claimpilot-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: claimpilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d claimpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: claimpilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  parser-service:
    build:
      context: ./parser-service
    container_name: claimpilot-parser-service
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
    container_name: claimpilot-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://user:password@postgres:5432/claimpilot?schema=public
      - REDIS_URL=redis://redis:6379
      - PARSER_SERVICE_URL=http://parser-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
